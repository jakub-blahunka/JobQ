name: Build

# Started by hand: Actions tab -> Build -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A cold build compiles llama.cpp from source, which dominates the run time.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Matches gradle/gradle-daemon-jvm.properties, so Gradle does not download a second JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      # The runner image ships the Android SDK with its licences accepted. The Android Gradle
      # Plugin downloads what the build needs beyond that: the platform, the NDK and CMake.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: jobq-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
